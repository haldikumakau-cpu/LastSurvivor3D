name: Build LAST SURVIVOR 3D APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize Android project
        run: |
          bubblewrap init \
            --manifest https://haldikumakau-cpu.github.io/LastSurvivor3D/manifest.json \
            --directory twa-project \
            --packageId com.lastsurvivor3d.game \
            --name "LAST SURVIVOR 3D" \
            --launcherName "LAST SURVIVOR" \
            --display standalone \
            --orientation landscape \
            --themeColor "#F5A623" \
            --backgroundColor "#0B0F14" \
            --skipPwaValidation

      - name: Build APK
        working-directory: twa-project
        run: bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-SURVIVOR-3D-APK
          path: twa-project/*.apk
